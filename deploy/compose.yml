# Shipped by scripts/deploy.sh as $DEPLOY_DIR/compose-<version>.yml on the
# server and run as compose project dogfight-<color> (blue/green);
# VERSION, COLOR, EDGE_NETWORK, TRUST_PROXY and PUBLIC_HOST come from
# $DEPLOY_DIR/env-<color> (deploy/deploy.env). No published port: nginx reaches the
# container as http://dogfight-<color>:8080 on the shared edge network (the
# deploy rewrites `set $dogfight_upstream` to switch colors), and only that
# network's subnet is trusted for X-Real-IP. Pilot stats live in the
# external volume dogfight-data, shared by both colors; the server's flock
# on /data/stats.lock keeps one writer at a time (the draining color hands
# it over on SIGUSR1). External: no compose command ever removes it.
# bluegreen: 1  (scripts/deploy.sh refuses to run a version whose compose file lacks this line in a color)
services:
  # Not "dogfight": compose adds the service name as a DNS alias on the edge
  # network, and "dogfight" is the pre-blue/green container's name. During the
  # migration (and its rollback) nginx resolves http://dogfight:8080, which
  # must reach only that container.
  dogfight-bg:
    image: dogfight:${VERSION:?set VERSION}
    container_name: dogfight-${COLOR:?set COLOR to blue or green}
    restart: unless-stopped # the deploy sets the draining color to `no`: it exits by itself
    command:
      - -addr=:8080
      - -origin=${PUBLIC_HOST:?set PUBLIC_HOST to the public host name}
      - -public-origin=wss://${PUBLIC_HOST} # CSP connect-src: old WebKit does not match wss: against 'self'
      - -trust-proxy=${TRUST_PROXY:?set TRUST_PROXY to the edge network subnet}
      - -log=json
      - -data=/data
      - -metrics-addr=127.0.0.1:9090 # loopback only: read via docker exec ... -get; not on the edge network
      - -drain-max=${DRAIN_MAX:-30m} # after SIGUSR1: exit when the last player left, or after this
      # Capacity (cmd/loadtest): ~64 concurrent players stayed healthy at cpus 1.0
      # on a small arm64 VM; cap a little above. Re-measure on your own hardware.
      - -max-conns=72
      - -max-rooms=8
    environment:
      GOMEMLIMIT: 200MiB # Go ignores the cgroup limit; collect before mem_limit
    networks:
      edge:
        aliases: ["dogfight-${COLOR}"]
    volumes:
      - dogfight-data:/data # pilot stats; the root FS stays read-only
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/dogfight", "-healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s # probe fast while starting (Docker >= 25)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: ${EDGE_NETWORK:?set EDGE_NETWORK to the nginx container's docker network}
    external: true

volumes:
  dogfight-data:
    name: dogfight-data
    external: true # created once (docker volume create dogfight-data); shared by both colors
